services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinic_local
      POSTGRES_USER: clinic_local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your .env file}
    volumes:
      - clinic_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinic_local", "-d", "clinic_local"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: rangarao-clinic-local:latest
    build: .
    environment:
      DATABASE_URL: postgresql://clinic_local:${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your .env file}@db:5432/clinic_local
      DIRECT_URL: postgresql://clinic_local:${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your .env file}@db:5432/clinic_local
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in your .env file}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  clinic_database:
